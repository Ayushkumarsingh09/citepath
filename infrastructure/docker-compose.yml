services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: citepath
      POSTGRES_PASSWORD: citepath
      POSTGRES_DB: citepath
    ports:
      - "55432:5432"
    volumes:
      - citepath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citepath"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  citepath_pg:
